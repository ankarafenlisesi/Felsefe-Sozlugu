<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Felsefe Sözlüğü</title>
<meta name="description" content="Ankara Fen Lisesi Felsefe Sözlüğü">
<meta name="theme-color" content="#1a1510" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Felsefe Sözlüğü">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='80' fill='%231a1510'/><text x='256' y='360' font-size='320' text-anchor='middle' fill='%23c9a84c' font-family='serif'>φ</text></svg>">
<link rel="manifest" id="pwa-manifest">
<script>
  // Erken tema init — flash önlemek için head'de çalışır
  (function() {
    const saved = localStorage.getItem('felsefe-theme');
    if (saved === 'light') {
      document.documentElement.classList.add('light');
    } else {
      try { localStorage.removeItem('felsefe-theme'); } catch(e) {}
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.classList.add('light');
      }
    }
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  /* === TEMA: varsayılan koyu === */
  :root {
    --ink: #e8dfc8;
    --paper: #1a1510;
    --aged: #2e2820;
    --accent: #d4894a;
    --gold: #c9a84c;
    --muted: #a89880;
    --light-muted: #6a5a48;
    --highlight: #231e18;
    --entry-def-color: #c8bfaa;
    --search-bg: rgba(0,0,0,0.2);
  }

  /* === Açık tema === */
  :root.light {
    --ink: #1a1208;
    --paper: #f5f0e8;
    --aged: #e8dfc8;
    --accent: #8b4513;
    --gold: #c9a84c;
    --muted: #7a6a55;
    --light-muted: #b5a898;
    --highlight: #f0e6d0;
    --entry-def-color: #3d3020;
    --search-bg: rgba(255,255,255,0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Lora', Georgia, serif;
    min-height: 100vh;
    padding-bottom: 27px;
    background-image:
      radial-gradient(ellipse at 10% 20%, rgba(201,168,76,0.07) 0%, transparent 60%),
      radial-gradient(ellipse at 90% 80%, rgba(139,69,19,0.06) 0%, transparent 60%);
  }

  /* Grain texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 2rem 6rem;
  }

  @media (min-width: 1200px) {
    .wrapper {
      max-width: 1200px;
      padding: 0 4rem 4rem;
    }
  }

  @media (min-width: 1600px) {
    .wrapper {
      max-width: 1400px;
      padding: 0 5rem 4rem;
    }
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 3rem 0 2rem;
    border-bottom: 1px solid var(--gold);
    margin-bottom: 3rem;
    gap: 1rem;
  }

  header::after { display: none; }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 700;
    line-height: 1.1;
    color: var(--ink);
    letter-spacing: -0.02em;
  }

  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .school-label {
    font-family: 'Lora', serif;
    font-size: 0.72rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }
  #theme-btn {
    position: relative;
    width: 36px;
    height: 36px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--highlight);
    border: 1px solid var(--aged);
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
    color: var(--gold);
  }

  #theme-btn:hover { border-color: var(--gold); }

  #theme-btn svg {
    position: absolute;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
  }

  /* Koyu temada: güneş görünür, ay gizli */
  #theme-btn .icon-sun {
    transform: rotate(0deg) scale(1);
    opacity: 1;
  }
  #theme-btn .icon-moon {
    transform: rotate(90deg) scale(0.5);
    opacity: 0;
  }

  /* Açık temada: ay görünür, güneş gizli */
  :root.light #theme-btn .icon-sun {
    transform: rotate(-90deg) scale(0.5);
    opacity: 0;
  }
  :root.light #theme-btn .icon-moon {
    transform: rotate(0deg) scale(1);
    opacity: 1;
  }

  /* Search */
  .search-area {
    margin-bottom: 2.5rem;
    display: flex;
    gap: 0;
    border: 1.5px solid var(--gold);
    background: var(--search-bg);
    border-radius: 2px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }

  .search-area:focus-within {
    box-shadow: 0 2px 20px rgba(201,168,76,0.2);
  }

  .search-icon {
    padding: 0 1rem;
    display: flex;
    align-items: center;
    color: var(--gold);
    font-size: 1rem;
  }

  #searchInput {
    flex: 1;
    padding: 0.85rem 0;
    font-family: 'Lora', serif;
    font-size: 1rem;
    border: none;
    background: transparent;
    color: var(--ink);
    outline: none;
  }

  #searchInput::placeholder { color: var(--light-muted); font-style: italic; }

  .result-count {
    padding: 0 1rem;
    display: flex;
    align-items: center;
    font-size: 0.78rem;
    color: var(--light-muted);
    white-space: nowrap;
    font-style: italic;
  }

  /* Alphabet nav */
  .alpha-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 2.5rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--aged);
    transition: opacity 0.2s;
  }

  .alpha-nav.hidden {
    display: none;
  }

  .alpha-btn {
    padding: 0.3rem 0.6rem;
    font-family: 'Playfair Display', serif;
    font-size: 1.11rem;
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    cursor: pointer;
    border-radius: 2px;
  }
  /* Mobil */
  @media (max-width: 768px) {
    .alpha-btn {
      font-size: 0.87rem;
      padding: 0.17rem 0.19rem;
    }
  }

  .alpha-btn.disabled { opacity: 0.3; cursor: default; pointer-events: none; }

  /* Section headers */
  .section-header {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    margin: 3rem 0 1.5rem;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
  }

  .section-letter {
    font-family: 'Playfair Display', serif;
    font-size: 4rem;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
    min-width: 3.5rem;
    text-align: center;
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, var(--aged), transparent);
  }

  /* Entries — accordion */
  .entry {
    border-bottom: 1px solid rgba(232, 223, 200, 0.6);
    opacity: 0;
    animation: fadeUp 0.4s ease forwards;
  }

  .entry-term {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem 0.5rem;
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent);
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.15s, box-shadow 0.15s;
    user-select: none;
  }

  .entry-term:hover {
    background: var(--highlight);
    box-shadow: inset 3px 0 0 var(--gold);
  }

  .entry-term.open {
    background: var(--highlight);
    box-shadow: inset 3px 0 0 var(--accent);
    border-radius: 2px 2px 0 0;
  }

  .entry-chevron {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    color: var(--gold);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .entry-term.open .entry-chevron {
    transform: rotate(180deg);
  }

  /* Scroll anchor koruması */
  .wrapper {
    overflow-anchor: auto;
  }

  .entry-def-wrap {
    height: 0;
    overflow: hidden;
    overflow-anchor: none;
    transition: height 0.32s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .entry-def-inner {
    /* padding için inner kullanılıyor */
  }

  .entry-def {
    font-size: 0.92rem;
    line-height: 1.75;
    color: var(--entry-def-color);
    padding: 0.6rem 0.5rem 1rem 0.5rem;
    background: var(--highlight);
    border-radius: 0 0 2px 2px;
    box-shadow: inset 3px 0 0 var(--accent);
  }

  .entry.hidden { display: none; }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* No results */
  .no-results {
    text-align: center;
    padding: 5rem 0;
    display: none;
  }

  .no-results-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.3; }
  .no-results p { color: var(--muted); font-style: italic; }

  /* Stats */
  .stats-bar {
    display: flex;
    align-items: center;
    gap: 2rem;
    margin-bottom: 2.5rem;
    padding: 0.75rem 1.5rem;
    background: var(--highlight);
    border-left: 3px solid var(--gold);
    font-size: 0.82rem;
    color: var(--muted);
  }

  .stats-bar.hidden { display: none; }

  /* Sabit köşe butonları */
  #scrollTop {
    position: fixed;
    bottom: 5.5rem;
    left: 2rem;
    width: 42px; height: 42px;
    background: var(--accent);
    color: var(--paper);
    border: none;
    border-radius: 2px;
    font-size: 1.2rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(139,69,19,0.3);
  }
  #scrollTop.visible { opacity: 1; }

  #randomBtn {
    position: fixed;
    bottom: 2rem;
    left: 2rem;
    width: 42px; height: 42px;
    background: var(--accent);
    color: var(--paper);
    border: none;
    border-radius: 2px;
    font-size: 1.4rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.3s, background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(139,69,19,0.3);
  }
  #randomBtn.visible { opacity: 1; }
  #randomBtn:hover { background: var(--gold); }

  #toggleAllBtn {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    padding: 0 1rem;
    height: 42px;
    font-family: 'Lora', serif;
    font-size: 0.82rem;
    font-style: italic;
    background: var(--accent);
    border: none;
    color: var(--paper);
    border-radius: 2px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.3s, background 0.15s;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(139,69,19,0.3);
    white-space: nowrap;
  }
  #toggleAllBtn.visible { opacity: 1; }
  #toggleAllBtn:hover { background: var(--gold); }
  footer {
    text-align: center;
    padding: 2.5rem 0 1rem;
    border-top: 1px solid var(--aged);
    margin-top: 4rem;
    font-size: 0.8rem;
    color: var(--light-muted);
    font-style: italic;
  }

  .footer-bottom {
    font-size: 0.75rem;
    color: var(--light-muted);
  }

  @media (max-width: 600px) {
    .entry { gap: 0.4rem; }
    .stats-bar { flex-direction: column; gap: 0.5rem; }
  }
</style>
</head>
<body>

<div class="wrapper">

  <header>
    <div>
      <p class="school-label">Ankara Fen Lisesi</p>
      <h1>Felsefe <em>Sözlüğü</em></h1>
    </div>
    <button id="theme-btn" onclick="toggleTheme()" title="Tema değiştir">
      <!-- Güneş -->
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <!-- Ay -->
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <div class="search-area">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Kavram ara…" autocomplete="off">
    <span class="result-count" id="resultCount"></span>
  </div>

  <div class="alpha-nav" id="alphaNav"></div>



  <div id="dictionary"></div>
  <div class="no-results" id="noResults">
    <div class="no-results-icon">∅</div>
    <p>Aradığınız kavram bulunamadı.</p>
  </div>

  <footer>
  <div class="footer-bottom">
    Ankara Fen Lisesi · Felsefe Sözlüğü
  </div>
</footer>
</div>

<button id="scrollTop" title="Yukarı çık">↑</button>
<button id="randomBtn" title="Rastgele kavram">⚄</button>
<button id="toggleAllBtn" onclick="toggleAll()">Tümünü Aç</button>

<script>
const entries = [
  { term: "Açıklama", def: "Bir şeyi bilinir ve anlaşılır hâle getirme. Bir sorunun, bilinmeyen bir şeyin, bir olgunun nedenini açık ve anlaşılır biçimde ortaya koyma." },
  { term: "Adalet", def: "Hakların gözetildiği, bireylerin eşit ve dengeli şekilde değerlendirildiği toplumsal düzen anlayışı. Hak sahibine hakkı olanı zamanında vermeye dayalı anlayış." },
  { term: "Ahlâk", def: "Genel anlamda mutlak olarak iyi olduğu düşünülen ya da belli bir yaşam anlayışından kaynaklanan davranış kuralları bütünü." },
  { term: "Akıl", def: "İnsanda soyutlama yapabilme, kavrayabilme, bağlantı kurabilme, düşünme, benzerlik ve farklılıkları anlayabilme ve anlamlandırabilme kapasitesi." },

  { term: "Analiz", def: "Bir bütünün parçalanarak ayrı ayrı incelenmesi, parçaların birbiriyle olan ilişkilerinin incelenmesi veya bu parçaların bütünle olan ilişkilerinin incelenme süreci." },
  { term: "Analoji", def: "Aklın, bazı olguların birbirine benzeyen özelliklerinden yola çıkarak onların başka alanlarda da birbirine benzediğini öne süren çıkarsamaya verilen ad." },
  { term: "Anarşizm", def: "Nispeten olumlu bir çerçeve içerisinde insanın özü itibariyle iyi olduğunu ve insan yaşamında karşılaşılan kötülüklerin politik baskı ve insanlar üzerindeki kontrolden geldiğini savunan politik anlayış." },
  { term: "Aposteriori Bilgi", def: "Duyusal deneyden türetilen ve duyu deneyi aracılığıyla kazanılan bilgi." },
  { term: "Apriori Bilgi", def: "Aklın ve aklın etkinliğinden üretilen ve duyusal deneye başvurulmadan elde edilen bilgi." },
  { term: "Arkhe", def: "Antik Yunan felsefesinde her şeyin kendinden varlığa geldiği düşünülen töz. \"ilk olan\", \"ilk neden\", \"kaynak\" gibi anlamlara da gelebilir." },
  { term: "Aşkın", def: "Genel olarak en üstün, en yüce, en yüksek niteliklere sahip olan varlık, transandantal." },
  { term: "Bağımsız", def: "Mantıksal olarak başka bir önermeden çıkmayan, bir mantıksal sistemin çıkarım kurallarıyla türetilemeyen." },
  { term: "Bağlam", def: "Bir şeyle doğrudan ilişkide bulunan, o şeyin bir anlamda kaynağını oluşturan, söz konusu şey karşısında tavırlarımızı ve ona ilişkin bilgilerimizi etkileyen anlamlar, düşünceler, ön kabuller ve perspektifler toplamı." },
  { term: "Belirsizlik", def: "Sözcüklerin, kavramların, adlandırdıkları veya uyguladıkları nesnelerin kapsamının net olarak bilinememesi durumu." },

  { term: "Bilinç", def: "Etrafındaki dünyanın, çevredeki varlıkların ve kendinin farkında olmak, duyabilmek, hissedebilmek, duyumlara uygun tepkiler verebilmek." },
  { term: "Bilinçaltı", def: "Gerçekte bilinç süreçleri olmadıkları halde bilinç süreçleri üstünde etkisi bulunan ruhsal süreçler." },
  { term: "Bürokrasi", def: "Bir toplumda tabandan yukarıya doğru daralan yapı içinde örgütlenmiş olan, kişisel olmayan genel kurallar ve işleyiş ilkelerine çalışan profesyonel görevliler grubu." },
  { term: "Cebriye", def: "İslâm dünyasında iyi ve kötünün bizzat Tanrı'dan geldiğini düşünen ve her eylemin önceden belirlenmiş yaratılıp takdir edildiğini söyleyen öğreti." },
  { term: "Cesaret", def: "Kişiye bir tehlikeyi, söz konusu olabilecek korku tarafından alt edilmeksizin göğüsleme imkânı veren zihniyet." },

  { term: "Çelişki", def: "Mantıkta bir önermenin hem kabulüne hem inkârından oluşan kümeye verilen ad." },
  { term: "Çıkarım", def: "Bir veya birden çok önermeden mantıksal sonuç elde etme. Doğruluğu bilinen bir önermeden yeni bir önerme çıkarma işi." },
  { term: "Çürütme", def: "Bir önerme veya kanıtlamayı, yanlışını göstermek suretiyle yanlışlama." },
  { term: "Davranışçılık", def: "İnsan ve hayvan davranışları inceleyen psikoloji alanına verilen ad." },
  { term: "Dayanak", def: "Genel olarak niteliklerin kendisine bağlandığı temel." },
  { term: "Değer", def: "Bireyin çevresiyle etkileşimi sonucunda içselleştirdiği, eylemlerini yönlendirdiği kalıcı bir yargı ve standart." },
  { term: "Değişim", def: "Devinimsel farklılaşma, karşılıklı iki durumda birinden öbürüne geçme." },
  { term: "Deizm", def: "Tanrı'nın evreni yarattığını, ancak daha sonra müdahale etmediğini savunan görüş." },
  { term: "Demokrasi", def: "Halkın kendi kendini yönetmesi anlamına gelen siyasi yönetim biçimi." },
  { term: "Deney", def: "Bir olayı ya da durumu kontrollü koşullarda inceleme yöntemi." },
  { term: "Dışavurum", def: "Ruhsal olay ve yaşantıların belli semboller ve göstergeler kullanma yoluyla dışlaştırılıp ifade edilmesi." },
  { term: "Dikkat", def: "Zihnin, faaliyetini belli bir nesne ve olay üzerinde yoğunlaştırması." },
  { term: "Diyalektik", def: "Kavramlar arasındaki karşıtlık ilişkisinden yola çıkarak bunu doğruya varan süreçlerin açığa çıkarılmasında bir ilke olarak kullanan düşünme ve araştırma yolu." },
  { term: "Diyalog", def: "İki veya daha fazla kişi arasında geçen felsefi tartışma." },
  { term: "Dogma", def: "Her türlü inceleme ve eleştirmenin dışında tutulan ve değişmez olduğu varsayılan, doğruluğu sınanmadan benimsenen, bir öğretinin veya ideolojinin temeli yapılan sav." },
  { term: "Doğruluk", def: "Bilginin olgulara ve gerçek duruma uygun olması." },
  { term: "Duyumculuk", def: "Bilginin duyumdan geldiğini ileri süren öğretilerin genel adıdır. Bu öğreti, zihnin bir tabula rasa (boş bir kâğıt) olarak görülmesinin sonucunda ortaya çıkar." },
  { term: "Düalizm", def: "Gerçekliğin iki temel tözden oluştuğunu savunan anlayış." },
  { term: "Dürtü", def: "Kaynağı duygulanım olan neden. Kaynağı us olan neden anlamındaki güdü terimine karşı kullanılır, ruhbilim terimi." },
  { term: "Egoizm", def: "Genel anlamıyla bireyin kendi çıkarları doğrultusunda hareket etmesi ile ilgilidir, ben sevgisidir, bencilliğin öne çıkarılması." },
  { term: "Empati", def: "Bir insanın kendisini karşısındaki insanın yerine koyarak onun duygularını ve düşüncelerini doğru olarak anlamasıdır. Karşıdaki kişinin penceresinden bakmak, onun ne duyduğunu, ne hissettiğini, niçin öyle davrandığını, niçin öyle düşündüğünü anlayabilme becerisi." },
  { term: "Empirizm", def: "Bilginin kaynağını deneyim ve duyularda gören yaklaşım." },
  { term: "Entüisyonizm", def: "Bilginin kaynağını sezgi olarak gören, sezgiyi aklın önüne geçiren ve sezgiyi felsefe bilgisinin temeli yapan görüş." },
  { term: "Erdem", def: "Ahlaki açıdan doğru davranışı alışkanlık hâline getiren nitelik." },
  { term: "Estetik Tavır", def: "Bir nesneye değerlendirme ve dikkatle yönelerek onun estetik özelliklerini fark etme biçimi." },
  { term: "Ezoterizm", def: "Asıl gerçeklerin yalnızca onu anlayabilecek yetenek ve bilgide olanlara bildirilebileceği görüşü üzerine temellenen bir öğreti sistemi." },
  { term: "Fenomen", def: "Deneyimlenen ve bilince göründüğü şekliyle kavranan olgu." },
  { term: "Filozof", def: "Gerçekliği, bilgiyi ve yaşamı soruşturmayı kendine iş edinmiş düşünür." },
  { term: "Fizik", def: "Evrenin yapısını, hareket ve enerji ilişkilerini inceleyen bilim." },
  { term: "Gerçeklik", def: "İnsandan bağımsız olarak var olan veya deneyimle doğrulanan durumların bütünü." },
  { term: "Güzellik", def: "İnsanda hoşluk, beğeni ve estetik haz uyandıran nitelik." },
  { term: "Hakikat", def: "Nesnel gerçeğin düşüncedeki yansımasına denir. Gerçek ile hakikat aynı şeyler değildir. Gerçek nesnel varoluşu, hakikat ise bu nesnel varoluşun zihnimizdeki öznel yansımasını dile getirir." },
  { term: "Hiyerarşi", def: "Önem ve değer bakımından gitgide yükselen basamaklar dizisi; astlık ve üstlük düzeni gözetilerek yapılan sınıflama." },
  { term: "Holizm", def: "Bütünün, kendisini oluşturan parçaların toplamından farklı ve daha fazla olduğunu ileri süren bir felsefi görüş ve Eski Yunancada \"bütün, tüm\" anlamlarına gelen \"Holos\" sözcüğünden türetilen bir felsefi terim." },
  { term: "İbadet", def: "İnanca dayalı saygı, bağlılık ve teslimiyet içeren manevi davranışlar." },
  { term: "İdea", def: "Zihinde yer alan soyut, değişmez ve asıl gerçekliği temsil eden kavramsal içerik." },
  { term: "İman", def: "Bir inancı kalpten kabul etme ve güven duygusuyla benimseme hâli." },
  { term: "İmge", def: "Zihinde tasarlanan ve gerçekleşmesi özlenen şey, hayal, genel görünüş, imaj." },
  { term: "İmgelem", def: "Edinilmiş imgeleri birleştirip kaynaştırma ve bu birleşiklerden yeni imgeler tasarlama yetisi." },
  { term: "İnanç", def: "Bir düşünceye çok sağlam bir biçimde gönülden bağlı bulunma, onu güvenle doğru sayma, bir fikir, aksiyom veya kesin bir bilgiye olan koşulsuz bağlanma." },
  { term: "İrade", def: "Eylemi düşünceye uygun olarak gerçekleştirebilme yetisi." },
  { term: "İrrasyonalizm", def: "Bilgi kuramı çerçevesinde görü, sezgi, sevgi, duygu ve içgüdüleri bilginin kaynağı sayan felsefi görüştür. Metafizik anlamda irrasyonalizm ise evrenin akıl dışı bir temelinin bulunduğunu, dolayısıyla aklın evrenin temelinde yer alan gerçekliğe ulaşamayacağını kabul eden görüşlere verilen ad." },
  { term: "İşlev", def: "Bir şey veya kimsenin yapısı veya konumu gereği yaptığı iş. Görev, fonksiyon." },
  { term: "Kanı", def: "Ansal ve mantıksal kanıtlarla elde edilen görüş. Düşünceyle ve mantıksal olarak bir sonuç elde etmeyi dile getirir." },
  { term: "Kavram", def: "Bir nesnenin zihindeki tasarımı. Bir yönüyle nesneye, diğer yönüyle anlama dönük bir ifade." },
  { term: "Kesin", def: "Şüphe ve duraksamaya yer bırakmayan. Mantık terimi olarak koşulsuz anlamını dile getirir." },
  { term: "Kolektivizm", def: "Bireyin devlet, ulus, ırk veya sosyal sınıf gibi bir sosyal kolektiviteye tabi olarak görüldüğü çeşitli sosyal örgütlenme modellerinden biri." },
  { term: "Kötümserlik", def: "Her şeyin kötü, hatta mümkün olabileceği kadar kötü olduğunu veya kötülüklerin toplamının iyiliklerin toplamından daha ağır bastığını ileri süren felsefe öğretisi." },
  { term: "Kuram", def: "Belli başlı kavramların bir araya gelerek oluşturduğu çerçeve." },
  { term: "Kuvvet", def: "Eyleme geçiren etken. Etki yapabilme ve etkiye karşı koyabilme gücü." },
  { term: "Kütle", def: "Küçük parçalardan meydana gelmiş büyük parça. Toplumsal anlamda insan kalabalığını dile getirir ve yığın deyimiyle nitelenir." },
  { term: "Liyakat", def: "Bir görevi başarıyla yapabilme gücü, yeterliliği ve ehliyeti." },
  { term: "Logos", def: "Yunancada usla kavrama anlamında ve duyguyla kavrama anlamındaki 'pathos' sözcüğü karşılığında kullanılır." },
  { term: "Madde", def: "Kütlesi olan, yer kaplayan ve duyularla algılanabilen varlık türü." },
  { term: "Mantık", def: "Bilinenden yola çıkarak bilinmeyenin bilgisine ulaşmaya vasıta olan bir bilim ya da kurallarına uyulduğu takdirde zihni hataya düşmekten koruyan bir disiplindir. Doğru düşünmeyi yanlış düşünmeden ayıran kurallar sistemi." },
  { term: "Metafizik", def: "Fizik ötesi varlığı, ilk nedenleri ve varlığın temellerini inceleyen alan." },
  { term: "Mimesis", def: "Taklit, benzetme, örnek alınan şeyi yeniden yapma anlamlarına gelen felsefi terim." },
  { term: "Mistisizm", def: "Doğaüstü güçlerin var bulunduğu ve bunlarla ilişki kurulabileceği temeline dayanan dinsel dünya görüşüdür." },
  { term: "Monad", def: "Leibniz'in felsefesinde, sonul gerçekliği oluşturan, sonsuz küçüklükte ruhsal-maddi varlıklara verilen ad." },
  { term: "Nedensellik", def: "Olay ve olguların birbirine belirli bir şekilde bağlı olması, her sonucun bir nedeninin bulunması ya da her sonucun bir nedene bağlanarak açıklanabilir olması ya da belli nedenlerin belirli sonuçlar doğuracağı, aynı nedenlerin aynı koşullarda aynı sonuçları vereceğinin iddiasını içeren felsefe terimi." },
  { term: "Nefs", def: "İnsanın arzu, istek ve benlik yönünü ifade eden manevi yönü." },
  { term: "Nesne", def: "Öznenin dışında bulunan ve onun bilmesine konu olan." },
  { term: "Nicelik", def: "Nesnenin ölçme konusu olan yanı." },
  { term: "Nitelik", def: "Nesnenin algılama konusu olan yanı." },
  { term: "Nominalizm", def: "Genel kavramları gerçek saymayıp onları birer addan ibaret olarak gören öğreti." },
  { term: "Nous", def: "Oluşu gerçekleştiren doğasal devim, doğasal hareket." },
  { term: "Olasılık", def: "Olayla koşulları arasındaki nesnel bağlantının çeşitli biçimlerinden biri." },
  { term: "Olgu", def: "Gerçekleşmiş olan her şey. Olmuş olan her şey \"olgu\"dur; bundan ötürü de olası, olanaklı ve düşünsel, tasarımsal deyimleriyle karşıt anlamlı." },
  { term: "Oluş", def: "Gerçekliğin sürekli değişim ve dönüşüm hâlinde bulunması." },
  { term: "Optimizm", def: "Genel olarak her düşünce ve eylemi iyi yanından alma eğilimi." },
  { term: "Öz", def: "Bir varlığı varlık yapan temel ve değişmez nitelikler." },
  { term: "Özümleme", def: "Canlı varlıkların yabancı varlıkları alarak kendi varlığına dönüştürme eylemi." },
  { term: "Paradigma", def: "Bir alanı anlamaya ve açıklamaya yarayan ortak düşünme çerçevesi." },
  { term: "Paradoks", def: "Kökleşmiş kanılara aykırı olarak ileri sürülen düşünce. Kendi içinde çelişkiliymiş gibi görünen, mantıksal olarak hem doğruluğu hem de yanlışlığı kanıtlanabilen önermeler." },
  { term: "Psikoloji", def: "İnsanın davranışlarını ve zihinsel süreçlerini inceleyen bilim." },
  { term: "Safsata", def: "İlk bakışta ikna edici görünen, fakat detaylıca irdelendiği zaman açığa çıkan akıl yürütmedeki yanlışlar, hatalı akıl yürütmeler." },
  { term: "Sentez", def: "Çeşitli öğeleri bir araya getirme, bir bütün içinde birleştirme." },
  { term: "Sınıflama", def: "Ortak özellikler taşıyan nesneleri bölümleme ve sıraya koyma." },
  { term: "Skolastik Felsefe", def: "Orta Çağ düşüncesinde doğrunun zaten mevcut olduğu düşüncesine ve felsefenin okullarda okutularak öğretilmesine dayanan bir yaklaşım. Bu felsefenin temeli teolojidir, ona dayanır ve onu desteklemeye çalışır." },
  { term: "Sonuç", def: "Herhangi bir olgu, olay ya da süreçten meydana gelen olgu, olay ya da süreç. Evrende her olgu, olay ve sürecin bir nedeni vardır, nedensiz hiçbir şey yoktur. Sonuç doğabilimsel bir terimdir, özellikle metafizik bir terim olan erek'le karıştırılmamalıdır." },
  { term: "Sorumluluk", def: "Kişinin eylemlerinin sonuçlarını üstlenmesi." },
  { term: "Süreç", def: "Belli bir düzen içinde yinelenen, ilerleyen, gelişen olay ya da eylemler dizisi." },
  { term: "Sürrealizm", def: "Ruhsal özdevimle sanat yapma temeline dayanan çağdaş bir sanat akımı." },
  { term: "Tasdik", def: "Bir düşünceyi zihinsel olarak onaylama ve kabul etme durumu." },
  { term: "Toplum Sözleşmesi", def: "Devletin kökenini bireylerin ortak anlaşmasına dayandıran yaklaşım." },
  { term: "Töz", def: "Başka bir şeye ihtiyaç duymadan var olduğu kabul edilen temel varlık." },
  { term: "Tutarlılık", def: "Bir düşünce veya sistemde çelişki bulunmaması." },
  { term: "Tümevarım", def: "Tek tek olgulardan yola çıkarak genel önermelere ulaşabilmek için izlenen düşünme yolu." },
  { term: "Uzam", def: "Ölçülebilen uzay. Uzaya göre uzam, zamana göre süre gibi." },
  { term: "Vahiy", def: "İlahi bilginin peygamberlere bildirilmesi olarak kabul edilen iletişim." },
  { term: "Varlık", def: "Gerçekliğin tümünü, var olan her şeyi ifade eden kavram." },
  { term: "Zihin", def: "Düşünme kapasitesi." },
  { term: "Panenteizm", def: "\"Her şey Tanrı'dır\" diyen panteizmden farklı olarak \"Her şey Tanrı'dadır\" diyen ve Tanrı ile evreni bir tutmayan Tanrı görüşü." },
  { term: "Popülizm", def: "20.yy'ın başlarında ortaya çıkmış olan ve burjuva psikolojisine ve işsiz bir toplum oluşturan aydınların özenli tavrına karşı küçümsenen işlerle uğraşan sınıfları tüm özellikleriyle yansıtmayı amaçlayan, halktaki iyi özellikleri gözler önüne sermeyi amaçlayan edebî okul." },
  { term: "Post-modernizm", def: "Kapitalist kültürde ya da daha genel olarak Batı dünyasında 20.yy'ın son çeyreğinde resim, edebiyat, mimari, güzel sanatlar alanında, özellikle felsefe ve sosyolojide belirgin hâle gelen hareket, akım, durum veya yaklaşım." },
  { term: "Pozitif", def: "Rasyonel veya spekülatif olanın tersine deneysel veya deneyimsel olan, özneler ve ideallerle değil de salt olgularla ilgili olan, müspet." },
  { term: "Pozitivizm", def: "Genel olarak modern bilimi temele alan, ona uygun düşen ve batıl inançları, metafizik ve dini insanlığın ilerlemesini engelleyen bilim öncesi düşünce tarzları ya da formları olarak gören dünya görüşü." },
  { term: "Pragmatizm", def: "Amerikan filozof William James tarafından geliştirilen ve her şeyden önce başta entelektüel problemler olmak üzere çeşitli problemleri çözmek için ortaya konan bir yöntemden, insan tarafından kazanılan çeşitli bilgi türlerine ilişkin bir teoriden ve nihayet evrenle ilgili belli bir metafizik görüşten oluşan öğreti." },
  { term: "Rasyonel", def: "Akla ve düşünce yasalarına uygun olan, akıl içeren ve aklın varlığı ya da faaliyetiyle belirlenen şey, akıllı ve akılcı şekilde fonksiyon göstermeye yetili olma." },
  { term: "Realizm", def: "Genel olarak olguları, ne kadar aykırı görünürlerse görünsünler oldukları gibi, şeyleri gerçekte oldukları gibi nesnel olarak ve dürüstçe kabul etme tavrı veya belli bir kategoriye giren varlık ya da nesnelerin zihinden bağımsız olduklarını öne süren öğreti." },
  { term: "Refleksivite", def: "Genel olarak dönüşürlük veya düşünümsellik olarak karşılanabilen ve dilin, düşüncenin, zihnin veya bir disiplinin kendi üzerine dönme gücünü veya yeteneğini anlatan terim." },
  { term: "Reformizm", def: "Var olan düzenden hoşnut olmama, var olan siyasi ve toplumsal düzenin özü itibarıyla sağlıklı olduğu, dolayısıyla da belirli bazı kurum, değer, faaliyet ya da koşullarda birtakım değişiklikler gerçekleştirildiğinde var olan düzenin iyileştirilebileceği, geliştirilebileceği ya da kurtarılabileceği inancıyla gelişen tavır." },
  { term: "Retorik", def: "Fikirleri, düşünceleri en iyi biçimde ifade etme, etkili konuşma. Dili, mahkemede adaleti gerçekleştirmek, politikada yarar sağlamak gibi temelde ikna etme amacıyla en etkili ve cezbedici şekilde konuşma sanatı, belâgat." },
  { term: "Sağduyu", def: "Dış dünya ile ilgili olan ve hemen herkes tarafından, tartışılmaksızın ve sorgulanmaksızın kabul edilen fakat zaman zaman filozofların araştırmaları ya da ulaştığı sonuçlarla çatışabilen genel inançlar sistemi." },
  { term: "Sanat", def: "Bir etkinliğin gerçekleştirilmesi için veya belirli bir işin yapılmasıyla ilgili yöntem, bilgi veya kuralların tümü. Bir işi belli bir estetik duyguyu yansıtacak şekilde gerçekleştirme tarzı." },
  { term: "Sezgi", def: "Bir şeyin bilgisine aklı kullanmadan ve doğrudan ulaşma yetisi. Analiz ya da kanıtlama yoluyla elde edilen bilginin tam tersine dolayımsız kavrayış ya da doğrudan bilgi." },
  { term: "Sezgicilik", def: "Genel olarak sezgiyi bilginin temeli olarak gören, her tür bilginin ve dolayısıyla da bilgeliğin doğrudan ya da dolaylı olarak entelektüel süreçlere ve akıl süzgecinden geçmiş yargılara dayandığını savunan anlayışa karşı cephe alarak açıklık ve kesinlik veren doğrudan ve aracısız kavrayışı ön plana çıkaran anlayış." },
  { term: "Sivil Toplum", def: "Siyasi otoritenin baskısından nispeten uzak olan toplum modeli, toplumda var olan ve kuruluşu birtakım haklar elde etme çabasına bağlı olan demokratik yapı." },
  { term: "Skolastik", def: "Genel olarak Orta Çağ'da etkin olan, Grek felsefesinin kavramsal araçlarından yararlanarak oluşturulmuş Tanrı merkezli düşünce sistemini ve bu teoloji ağırlıklı felsefenin kullandığı yöntemi tanımlamak amaçlı kullanılan sıfat." },
  { term: "Sofistler", def: "Milattan önce 4. ve 5. yüzyıllarda siyasi ve toplumsal koşulların değişmesinin ve doğa felsefesinin iflasının ardından insan üzerine felsefenin başlatıcısı olarak ortaya çıkan gezgin felsefe öğretmenlerine verilen genel ad." },
  { term: "Sofistlik", def: "Belli bir doğruya ulaşmak için değil de tartışmış olmak için tartışma tavrı; aldatmayı, ikna etmeyi sözün etkisiyle inandırmayı amaç edinen akıl yürütme tarzı." },
  { term: "Sosyoloji", def: "Bütün çeşitliliği, değişkenliği ve tüm ayrıntıları içinde topluma dair olan açıklayıcı bilim." },
  { term: "Spekülatif", def: "Eylem ya da pratiği hiç dikkate almadan salt bilgiye erişmeyi amaçlayan düşünsel veya entelektüel işlemler yani pratiğe karşıt olarak teorik olan." },
  { term: "Stoacılık", def: "Milattan önce 336-264 yılları arasında yaşamış olan Zenon tarafından kurulmuş ve Helenistik Dönem'de etkili olmuş olan felsefe okulu." },
  { term: "Şey", def: "Tözle yani kendisini belirleyen tüm niteliklerden bağımsız olarak düşünülen gerçek ve somut özneyle eşdeğer olan terim." },
  { term: "Şeycilik", def: "Dünyanın bireysel somut nesnelerden meydana geldiği kabulüne dayanan, ontolojik ve semantik görüş ya da öğreti." },
  { term: "Tabula Rasa", def: "İngiliz empirist felsefe geleneğinin kurucusu olan Locke'un, zihnin doğuşta her tür deneyim öncesinde bomboş olduğuna işaret etmek için kullandığı Latince deyim." },
  { term: "Taoizm", def: "Çin'de milattan önce 6. yüzyıllarda doğmuş olduğu kabul edilen Lao Tse tarafından kurulmuş olan felsefi öğreti. Doğa ya da gökyüzünün yasası diye yorumlanan Tao'yu temele almayı öneren anlayış." },
  { term: "Tasavvuf", def: "Öncelikle Tanrı'nın niteliğini ve evrenin oluşumunu vahdeti vücut yani varlığın birliği görüşüyle açıklayan felsefi anlayış." },
  { term: "Teizm", def: "En genel şekilde var olan ve her şeyin yaratıcısı olan bir Tanrı'nın varlığına inanma, Tanrı'nın mutlak bir güce ve sınırsız bir bilgiye sahip olduğuna sarsılmaz bir inanç besleme." },
  { term: "Teleoloji", def: "Genel olarak amaçları, erekleri, hedefleri gözetme tavrı. Doğada amaçlılık ve düzen arayan disiplin." },
  { term: "Temelcilik", def: "Genel olarak bilginin son çözümlemede, başka bir haklılandırma veya temellenmeye ihtiyaç duymayan temel inanışlara dayandığını savunan öğreti." },
  { term: "Teoloji", def: "Dine ilişkin olgu ve fenomenleri konu alan ve dinle ilgili olarak geniş kapsamlı bir senteze ulaşmayı amaçlayan disiplin." },
  { term: "Tez", def: "Genel olarak doğru olduğu inancıyla öne sürülen ve savunulan düşünce, iddia, genel fikir ve önerme." },
  { term: "Tikel", def: "Bir iddianın, bir sınıfın tüm üyeleri için değil de belirsiz bir bölümü için geçerli olması durumunu ortaya koyan terim." },
  { term: "Tin", def: "Bazı metafizikçilerin ya da Hegel gibi nesnel idealistlerin, gerçekliği ve evreni açıklamak üzere var olan her şeyin temeli, özü olarak kabul ettikleri cisimsel olmayan varlık." },
  { term: "Totoloji", def: "Aynı anlamı farklı sözcükler kullanarak tekrar eden, aynı düşünceyi değişik ifadelerle yeniden ortaya koyan tümce veya yargı." },
  { term: "Tözcülük", def: "Dünyanın var olmak için kendisinden başka bir şeye ihtiyaç duymayan, zihinden bağımsız olan bireysel varlıklar anlamında tözlerden meydana geldiğini savunan varlık görüşü." },
  { term: "Tümdengelim", def: "Genelden özeli çıkarsayan akıl yürütme biçimi, yeni bilgi vermeyip yalnızca öncüllerin üzerindeki örtüyü kaldırmakla yetinen argüman." },
  { term: "Tümel", def: "İstisna kabul etmeme, bir sınıfın tüm üyeleri için geçerli olma durumu. Genel olan, sınırsız ya da sınırlanmamış olan." },
  { term: "Uzlaşım", def: "Doğada var olmayıp sonradan yapılan genel bir anlaşmanın ürünü olan, doğruluğu doğada var olan şeylere değil de anlaşmaya bağlı olan genel önerme veya kabul." },
  { term: "Üst İnsan", def: "Geleneksel ahlakı köle ahlakı olarak gören Alman düşünür Friedrich Nietzsche tarafından öngörülen insanlık düzeyi." },
  { term: "Ütopya", def: "İdeal ya da yetkin toplum. İdeal toplum düzeni ya da yönetim biçimi ortaya koyan tasarım." },
  { term: "Ütopyacılık", def: "Toplum kuramı veya siyaset teorisinde mükemmel bir toplum modeli veya tasarısını temele alan yaklaşım." },
  { term: "Vacibü'l Vücud", def: "İslam felsefesinde özü var oluşunu içeren, kendi kendisiyle var olup kendi dışında bir güce muhtaç olmayan, zorunlulukla var olan varlık için kullanılan terim." },
  { term: "Vahdet-i Vücud", def: "Varlıktaki mutlak birliği, yaratanla yaratılanın birliğini savunan varlık görüşü, tasavvuf anlayışı." },
  { term: "Var Oluş", def: "Varoluşçu felsefe geleneği içinde özgür bireyle ilgili bir kategori olarak kişinin kendisini alternatifler karşısındaki özgür seçimler yoluyla gerçekleştirmesi durumuna ya da eylemine verilen ad." },
  { term: "Varoluşçuluk", def: "İnsanın var oluşuyla doğal nesnelere özgü varlık türü arasındaki karşıtlığı büyük bir güçle vurgulayan, insanların irade ve bilinçten yoksun olan nesneler dünyasına fırlatılmış olduğunu savunan düşünce akımı." },
  { term: "Yabancılaşma", def: "Özgün anlamı içinde bir şeyi ya da bir kimseyi bir yerden ya da bir şeyden uzaklaştırıp başka bir şeye ya da kimseye yabancı haline getiren eylem ya da gelişme." },
  { term: "Yanılsama", def: "Alışılmadık, normal olmayan koşulların sonucu olarak duyu verilerinin yanlış yorumlanmasına bağlı olan yanıltıcı algı, nesneyi olduğundan başka türlü algılama hali." },
  { term: "Yanlış", def: "Doğru olmayan, gönderimde ya da atıfta bulunduğu olgu doğru olmayan. Gerçekliğe uymayan, dış dünyada karşılık bulmayan." },
  { term: "Yanlışlanabilirlik İlkesi", def: "Karl Raimund Popper'in mantıkçı pozitivizmin doğrulanabilirlik ilkesine karşı alternatif olarak öne sürdüğü ilke." },
  { term: "Yapısalcılık", def: "Felsefi ve toplumsal problemleri genel yapı ya da modeller aracılığıyla açıklamaya çalışan yaklaşım." },
  { term: "Yararcılık", def: "Genel iktisadi bir öğreti, bir siyaset felsefesi ve toplum teorisi olarak iyinin mutluluk ve hazza dolayısıyla da doğruya eşit olduğu görüşü." },
  { term: "Yasa", def: "Şeyleri belirlediği şekilde kabul edilen ilke, doğal olayları birbirine bağlayan zorunlu ilişkiyi ortaya koyan genel prensip." },
  { term: "Yazgıcılık", def: "İnsanın tüm eylemlerinin ve gerçekte tüm olayların önceden belirlenmiş olduğunu, tüm olayların değişmezcesine ayarlandığını öne süren görüş." },
  { term: "Zaman", def: "Ölçülebilir nitelik olarak düşünülen süre. Şimdinin geçmiş olmasına yol açan ve genellikle süre olarak düşünülen soyut kavram." },
  { term: "Zihin Felsefesi", def: "Zihinleri, zihin hallerini ve başka zihinlere ilişkin bilgiyi konu alan felsefe dalı." },
  { term: "Acıcılık", def: "Acıyı düşünsel, ahlaki, estetik açıdan yücelten öğreti. Dolorizm." },
  { term: "Algıcılık", def: "Zihnin algı edimiyle dış dünyanın doğru bilgisine doğrudan doğruya ulaştığını bildiren öğreti." },
  { term: "Araççılık", def: "Amerikalı pragmatist John Dewey'nin her kuramı deney ve eylem için bir araç sayan öğretisi." },
  { term: "Aranedencilik", def: "Dünyada gerçek nedenlerin değil de gerçek nedenlere bağlı ikincil nedenlerin etkin olduğunu öne süren öğreti." },
  { term: "Atomculuk", def: "Maddenin atomlardan oluştuğunu benimseyen ve maddi gerçekliği atomlara indirgeyen felsefi öğreti." },
  { term: "Aydınlanmacılık", def: "18.yy'ın özellikle ikinci yarısında gelenekçi ve dinci anlayışa karşı ilerlemeciliği, araştırıcı akılcılığı savunanların düşüncesi." },
  { term: "Beniçincilik", def: "Her şeyi kendine bağlama, kendini evrenin merkezi sayma eğilimi. Egosantrizm." },
  { term: "Biçimcilik", def: "Biçime büyük önem veren, tüm açıklamaların mantıksal olarak yapılmasını öngören öğreti. Formalizm." },
  { term: "Bilimcilik", def: "Bilimin her türlü sorunu çözebileceğine dayanan ve bilimsel bilgi dışında her türlü bilgiyi yadsıyan öğreti." },
  { term: "Birleştirmecilik", def: "Birbirine uymamakla birlikte iyi kavranılmadığı için bağdaşık görünen değişik görüşlerden oluşturulmuş din ya da felsefe öğretisi." },
  { term: "Çevrimcilik", def: "Evrensel olayların dönemsel olarak dönüşlülüğü düşüncesi." },
  { term: "Çilecilik", def: "Tanrı'ya ulaşma yolunda hazlardan kaçışı ve acıya yönelişi öngören dinsel tutum." },
  { term: "Çoğulculuk", def: "Evreni oluşturan varlıkların çok olduğunu, bunların tek bir kaynaktan gelmediğini öne süren öğreti. Plüralizm." },
  { term: "Devletçilik", def: "Toplumsal ve ekonomik yaşamda devlet katılımının geniş çerçeveli olmasını öngören siyasal öğreti." },
  { term: "Doğacılık", def: "Doğayı kutsama ve yüceltme eğilimi. Dinlerin kökenini fiziksel dünyadaki çarpıcı nesnelerin kişileştirilmesine ve yüceltilmesine bağlayan tarih görüşü. Natürizm." },
  { term: "Doğalcılık", def: "Doğanın dışında hiçbir şeyin var olmadığını ileri süren ve buna göre her şeyi, deneyine ulaştığımız doğal olaylar zincirine indirgeyen öğreti. Natüralizm." },
  { term: "Edimcilik", def: "Kuramsal ilkelerden çok yaşamın ve eylemin gereklerini göz önünde tutan ahlak anlayışı." },
  { term: "Eleştiricilik", def: "Her bilgi edinme çabasında eleştirici tutumu öncelikli tutum olarak değerlendiren görüş. Kritisizm." },
  { term: "Evrimcilik", def: "Gerçekliğin oluşumlarını daha üst yapılara dönüşümle açıklayan bilimsel ya da felsefi öğreti." },
  { term: "Gerçeküstücülük", def: "Aklın denetiminden kurtulmuş ruhsal etkinlikleri yaratmada başlıca kaynak olarak gören sanat akımı. Sürrealizm." },
  { term: "İstemcilik", def: "İstemi evrenin özü sayan ve yargıda istemin belirleyici olduğunu savunan öğreti." },
  { term: "Karanlıkçılık", def: "Kültürün halk arasında yayılımının yararsız hatta zararlı olduğunu öne süren öğreti." },
  { term: "Kazanççılık", def: "Her şeyi kazanma eğilimine bağlayan görüş. Aşırı kazanç sağlamak üzere ticaret yapma eğilimi. Merkantilizm." },
  { term: "Kişilikçilik", def: "Kişiliği en yüce belirleyici sayan öğreti. Kişiliği mutlak değerler konumuna getiren ahlak ve toplum öğretisi." },
  { term: "Komünizm", def: "Ortak mülkiyete dayanan yönetim biçimi. Üretim araçlarının topluma ait olduğunu savunan siyasal ve toplumsal düzen." },
  { term: "Köktencilik", def: "Bilimde, dinde, siyasette kökten değişiklikler yapma eğilimi. Radikalizm." },
  { term: "Maddesizcilik", def: "Maddenin varlığını yadsıyan, yalnızca ruhların ve fikirlerin varlığını öne süren öğreti. İmmateryalizm." },
  { term: "Açıklık", def: "Kendisini zorla kabul ettiren, kendisinin bilincine varmamızı sağlayan, anlam belirsizliğine yer vermeyen, tartışılmayacak kadar kesin, net ve belirgin olan şeyin özelliği." },
  { term: "Akılcılık", def: "Evreni bir bütün olarak yorumlamayı, bireysel ve toplumsal yaşamı aklın ilkelerine göre düzenlemeyi amaçlayan tavır, rasyonalizm." },
  { term: "Analitik", def: "Analizi yöntem olarak kullanan, analizle ilgili olan." },
  { term: "Analitik Felsefe", def: "20. yy'da özellikle Amerika ve İngiltere'de etkili olan ve dil üzerinde yoğunlaşarak olgulara ve anlamlara uygun düşecek en iyi ve en dakik mantıksal formu bulmak için tümceleri, kavramları, dilsel ifadeleri analiz etmekle uğraşan felsefi akım." },
  { term: "Anomali", def: "Kuralsızlık, alışılmış tipten ayrılan şeyin karakteri, olağan bir durum veya kuraldan sapma hâli." },
  { term: "Antitez", def: "Genel olarak bir önermenin karşıtı veya çelişiği olan önerme." },
  { term: "Antropoloji", def: "İnsanın hayvanlar dünyasındaki yerini, kökenini, bir birey olarak gelişimini, tarihsel süreç boyunca geçirdiği fiziksel değişimleri konu alan disiplin; bir toplumsal varlık olarak insanı, insanın toplumsal yaşamıyla ilgili fenomenleri zaman veya mekân sınırlaması olmadan araştıran, farklı yerlerde farklı zamanlarda ortaya çıkmış ırkları, dilleri ve kültürleri inceleyen bilim." },
  { term: "Antropomorfizm", def: "İnsanbiçimcilik. İnsana ait özelliklerin insan dışındaki varlıklara yüklenmesini ifade eder." },
  { term: "Apolitizm", def: "Siyasetten, siyasi sorunlardan uzak durmayı, siyasi sorunlara değilse bile bu sorunların çözümleriyle ilgili tartışmalara, bu sırada ülkeyi ve yönetimi ele geçirmek, yönetimde söz sahibi olmak ve kendi çözümünü dayatmak için yürütülen siyasi mücadelelere yabancı kalmayı ilke edinmiş kişinin tavrına verilen ad." },
  { term: "Aristokrasi", def: "Orijinal ve etimolojik anlamı içinde en iyilerin, hem düşünsel hem de tarihsel olarak, monarşinin ve demokrasinin karşısında yer alan yönetimi." },
  { term: "Argüman", def: "Bir tezi, bir görüşü desteklemek, doğrulamak veya güçlendirmek için getirilen, bir ya da birden fazla öncül veya kabulden belli bir sonucun çıkarıldığı kanıtlama tarzı ve formu." },
  { term: "Bağnazlık", def: "Çoğunlukla dinî ve siyasi alanda belli bir inanç, kanaat ve ideolojiye tutkuyla bağlanma durumu." },
  { term: "Belirlenimcilik", def: "Metafizikte her şeyin belirlenmiş olmadığını, dünyada rastlantı ve özgürlüğe de yer bulunduğunu savunan görüş, indeterminizm." },
  { term: "Bellek", def: "Geçmişteki deneyimleri, tecrübe ve yaşantıları anımsayabilme yetisi." },
  { term: "Bencillik", def: "Genel olarak kişinin kendi benine ve kendi çıkarlarına düşkünlük göstermesi, başkalarını dikkate almadan yalnızca kendini ve kendi iyiliğini, refahını ve mutluluğunu düşünmesi ve bunu yaşamının mutlak ilkesi haline getirmesi." },
  { term: "Bilgi", def: "Öznenin amaçlı yönelimi sonucunda özneyle nesne arasında ilişki kurulan ilişki sonucu oluşan ürün." },
  { term: "Brahman", def: "Hinduizm'de evrene hâkim olan yüce ruh. Hem içkin hem aşkın hem evrende hem de kendisinde var olan en yüksek varlığa, kendisiyle birleşmenin ruhani ve en yüksek hedef olarak addedildiği dünya ruhu." },
  { term: "Budizm", def: "Hindistan'da milattan önce 5. yy'da Siddharta Gautama (Buda) tarafından kurulmuş olan dinî-felsefi akım. Her şeyin fani ve boşluktan ibaret olduğuna inanan kötümser ve panteist bir din." },
  { term: "Cins", def: "Alt sınıflara ya da türlere ayrılabilen bir nesneler sınıfı." },
  { term: "Çağrışım", def: "Genel olarak iki ya da daha fazla öge arasındaki işlevsel bağıntıya, bilinçteki ögelerin ya da bileşenlerin, iradelerin aracılığı olmadan birbirine bağlanmalarıyla ilgili psikolojik fenomen." },
  { term: "Çelişmezlik İlkesi", def: "Aristoteles'in ifadesiyle aynı yüklem ya da niteliğin aynı özneye hem ait olup hem ait olmamasının söz konusu olamayacağını dile getiren temel mantıksal ilke." },
  { term: "Çevrecilik", def: "Genel olarak çevrenin insan faaliyetleri üzerindeki etkisini vurgulayan felsefi öğreti." },
  { term: "Daimon", def: "İlk Çağ Yunan felsefesinde bir tür Tanrı ya da Tanrısal güç. Platon'a göre tanrılarla insanlar arasında bulunan, tanrılara insanların niyazlarını, insanlara da tanrıların buyruklarını ileten güç." },
  { term: "Dasein", def: "Almancada \"var oluş\" için kullanılan ve \"burada olmak\" anlamına gelen terim." },
  { term: "Deneyim", def: "Genel olarak özneyle dış dünyadaki varlıklar arasındaki bağlantı ya da karşılıklı etkiye ne salt öznel ne de salt nesnel bir şey olarak canlı organizma ile çevresi arasındaki ilişki." },
  { term: "Determinizm", def: "Evrende olup biten her şeyin bir nedensellik bağlantısı içinde gerçekleştiğini, fiziksel evrendeki ve dolayısıyla da insanın tarihindeki tüm olgu ve olayların mutlak olarak nedenlerine bağlı olduğunu ve nedenleri tarafından koşullandığını savunan anlayış." },
  { term: "Devlet", def: "Toplumu yöneten kurallar ve yasalar yaratma otoritesine sahip ayrı bir kurumlar kümesi." },
  { term: "Dil Felsefesi", def: "Felsefenin, dili tüm boyutları içinde kavramsal bir analize tabi tutan, insanların dili kullanma etkinliği üzerinde yoğunlaşan dalı. Dilin doğasını, kökenini, yapısını ve anlam problemini ele alan araştırma alanı." },
  { term: "Din", def: "İnsan varlığının yaşam ve tecrübelerinin üç temel boyutuyla ilgili sorulara, belirli özellikleri olan bir Tanrı kavramıyla yanıt vermeye çalışan inanç sistemi." },
  { term: "Din Felsefesi", def: "Felsefenin, dinin özünü, ilkelerini, din tanımlarını, çeşitli Tanrı kavramlarını, Tanrı, insan ve evren ilişkisini, Tanrı'nın varlığıyla ilgili kanıtlamalarını, inanç, akıl ve dogmanın anlamlarıyla karşılıklı ilişkilerini konu edinen dalı." },
  { term: "Dogmatizm", def: "Genel olarak kimi öğretilere en küçük bir eleştiriye izin vermeden, rasyonel ve mantıksal kanıtlar yerine salt duygulara ve kişisel eğilimlere dayanarak körü körüne inanma, onları sorgusuz ve sualsiz bir biçimde benimseme." },
  { term: "Doğa", def: "Bir organizmanın doğuştan getirdiği veya miras aldığı varsayılan özellik ya da karakteristiklerinin bütünü." },
  { term: "Doğa Felsefesi", def: "Tarihsel bir çerçeve içerisinde öncelikle Antik Çağ'da veya Helenistik Dönem'de milattan önce 6. ve 5. yy'ların salt doğayı konu alan felsefesi. Sonrasında Yunan ve Hristiyan Avrupa'da genel metafizik sistemlerin doğaya ilişkin açıklamalarından meydana gelen dalları." },
  { term: "Doğal Hukuk", def: "Hukuku bir bütün olarak haklı kılan ve her tür hukuk sisteminden önce gelen apriori öge. Her tür hukukun ideal kaynağı ve bu idealden türeyen pozitif hukuku sınama ölçütü, değişen kurallar ve yasalar karşısındaki değişmez hukuk kuralları bütünü olarak insan ya da toplumun özsel, temel ve asli doğasında temellenen toplum tarafından sonradan konulan yasalar ve başka değerlerden bağımsız olan hukuk." },
  { term: "Doğaüstü", def: "Evrenden güç, değer ve gerçeklik bakımından daha üstün olduğuna, evrenin üstünde ve ötesinde bulunduğuna, evrenin etkin güç ve yasalarını aştığına, evreni belli bir şekilde ve belli ölçüler içinde denetlediğine ve nihayet evreni hiçten yarattığına inanılan varlık ya da varlık alanı için kullanılan sıfat." },
  { term: "Doğrulanabilirlik İlkesi", def: "Mantıkçı pozitivistlerin, bir tümcenin anlamlı olabilmesi için ya analitik olması ya da deneysel olarak doğrulanabilir olması gerektiğini savunan ünlü ilke ya da öğretisi." },
  { term: "Doktrin", def: "Savunulan ve öğretilen bir öğretim ya da ilke, dinî, felsefi ya da siyasi bir sistem veya öğretimdeki inanç veya öğretimdeki kavramların bütünü, bir konudaki ilgili fikirler toplamı. Öğreti." },
  { term: "Doxa", def: "Platon'da, nesneleri İdealar olan 'episteme' ya da bilgiyle kıyaslandığında daha aşağı bir bilinç düzeyine karşılık gelen sanı ya da kanaat." },
  { term: "Duyu", def: "Görme, işitme, dokunma, tat ve koku alma yetilerine, organlarına veya bir insan organizmasının kendisinin dışında zaman ve mekân içinde bulunan fiziksel ya da kimyasal nitelikli ögelere ilişkin bilgi edinmesini sağlayan fonksiyonlar bütünü." },
  { term: "Dünyevileşme", def: "Dinî inançları ve uygulamaları yalnızca kişisel değil fakat toplumsal karar alma ve eylemde yol göstericiler olarak değerlendirmeme tavrı ya da süreci." },
  { term: "Düşünce", def: "İnsana özgü olan düşünme faaliyetinin iç ya da dış uyaranlara yanıt olarak gelişen düşünme ediminin ürününe, insanın zihinsel faaliyetleri ile dış dünya arasında kurduğu bağlantı sonucu oluşan şey." },
  { term: "Entelektüalizm", def: "Genel olarak zihni, bilginin ve eylemin tek gerçek ilkesi olarak gören öğreti, zihinsel fenomenlerin duygular ve irade karşısında önce ve üstün olduğunu savunan felsefe anlayışı." },
  { term: "Episteme", def: "İlk Çağ Yunan felsefesinde sanı, kanaat ve inanç anlamına gelen 'doxa'dan farklı olarak doğru bilgi, bilimsel ya da sistematik bilgi, ilk ilkelerden hareketle kanıtlanabilir olan zarurî bilgi için kullanılan terim." },
  { term: "Epistemoloji", def: "Felsefenin, bilişsel süreçlerin oluşumlarından ziyade bilgiyi genel olarak ele alan, bilgiyle ilgili problemleri araştıran, bilginin kaynağını, doğasını, doğruluğunu araştıran dalı. Bilgi felsefesi." },
  { term: "Epokhe", def: "Antik Yunan felsefesinde, kuşkucular tarafından savunulan, hiçbir konuda kesin ve nihai karar veya yargı beyan etmemenin, bir yandan araştırmaya devam ederken bir yandan da yargıyı askıya alma, hüküm vermeme tavrı." },

// Sort entries alphabetically (Turkish locale)
entries.sort((a, b) => a.term.localeCompare(b.term, 'tr'));

// Group by first letter
function getFirstLetter(term) {
  const t = term.trim();
  const first = t[0].toLocaleUpperCase('tr');
  return first;
}

function groupEntries(list) {
  const groups = {};
  list.forEach(e => {
    const l = getFirstLetter(e.term);
    if (!groups[l]) groups[l] = [];
    groups[l].push(e);
  });
  return groups;
}

// Render
const dictEl = document.getElementById('dictionary');
const searchInput = document.getElementById('searchInput');
const resultCountEl = document.getElementById('resultCount');
const noResults = document.getElementById('noResults');
const alphaNav = document.getElementById('alphaNav');
searchInput.placeholder = entries.length + ' kavram içinde ara…';

function renderAll(list) {
  dictEl.innerHTML = '';
  const groups = groupEntries(list);
  const letters = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'tr'));

if (list.length === 0) {
    noResults.style.display = 'block';
    resultCountEl.textContent = '0 sonuç';
    return;
  }

  noResults.style.display = 'none';

  letters.forEach((letter, gi) => {
    const section = document.createElement('div');
    section.className = 'section';
    section.id = 'section-' + letter;

    const header = document.createElement('div');
    header.className = 'section-header';
    header.style.animationDelay = (gi * 0.05) + 's';
    header.innerHTML = `<div class="section-letter">${letter}</div><div class="section-line"></div>`;
    section.appendChild(header);

    groups[letter].forEach((e, i) => {
      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.style.animationDelay = (gi * 0.05 + i * 0.03) + 's';
      entry.innerHTML = `
        <div class="entry-term" onclick="toggleEntry(this)">
          <span>${e.term}</span>
          <svg class="entry-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        <div class="entry-def-wrap">
          <div class="entry-def-inner">
            <div class="entry-def">${e.def}</div>
          </div>
        </div>`;
      section.appendChild(entry);
    });

    dictEl.appendChild(section);
  });
}

// Alpha nav
const allLetters = [...new Set(entries.map(e => getFirstLetter(e.term)))].sort((a,b) => a.localeCompare(b,'tr'));
const turkishAlpha = ['A','B','C','Ç','D','E','F','G','H','I','İ','J','K','L','M','N','O','Ö','P','R','S','Ş','T','U','Ü','V','Y','Z'];

turkishAlpha.forEach(l => {
  const btn = document.createElement('button');
  btn.className = 'alpha-btn' + (allLetters.includes(l) ? '' : ' disabled');
  btn.textContent = l;
  if (allLetters.includes(l)) {
    btn.addEventListener('click', () => {
      const el = document.getElementById('section-' + l);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }
  alphaNav.appendChild(btn);
});

// Search — sadece terim adında ara
searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLocaleLowerCase('tr').trim();
  if (!q) {
    alphaNav.classList.remove('hidden');
    renderAll(entries);
    resultCountEl.textContent = '';
    return;
  }
  alphaNav.classList.add('hidden');
  const filtered = entries.filter(e =>
    e.term.toLocaleLowerCase('tr').includes(q)
  );
  renderAll(filtered);
  resultCountEl.textContent = filtered.length + ' sonuç';
});

// === Accordion ===

function openEntry(termEl, instant) {
  const wrap = termEl.nextElementSibling;
  const inner = wrap.firstElementChild;
  termEl.classList.add('open');
  if (instant) {
    wrap.style.transition = 'none';
    wrap.style.height = inner.offsetHeight + 'px';
  } else {
    wrap.style.transition = 'none';
    wrap.style.height = 'auto';
    const h = inner.offsetHeight;
    wrap.style.height = '0';
    requestAnimationFrame(() => {
      wrap.style.transition = '';
      wrap.style.height = h + 'px';
    });
  }
}

function closeEntry(termEl, instant) {
  const wrap = termEl.nextElementSibling;
  termEl.classList.remove('open');
  if (instant) {
    wrap.style.transition = 'none';
    wrap.style.height = '0';
  } else {
    wrap.style.height = wrap.offsetHeight + 'px';
    requestAnimationFrame(() => {
      wrap.style.transition = '';
      wrap.style.height = '0';
    });
  }
}

function toggleEntry(termEl) {
  if (termEl.classList.contains('open')) {
    closeEntry(termEl, false);
  } else {
    openEntry(termEl, false);
  }
  updateToggleAllBtn();
}

function toggleAll() {
  const allTerms = document.querySelectorAll('.entry-term');
  const allOpen = [...allTerms].every(t => t.classList.contains('open'));

  // Anchor: ekranın ortasına en yakın entry
  let anchorEl = null;
  const mid = window.innerHeight / 2;
  let minDist = Infinity;
  allTerms.forEach(t => {
    const dist = Math.abs(t.getBoundingClientRect().top - mid);
    if (dist < minDist) { minDist = dist; anchorEl = t; }
  });

  const anchorTopBefore = anchorEl ? anchorEl.getBoundingClientRect().top : 0;

  allTerms.forEach(t => allOpen ? closeEntry(t, true) : openEntry(t, true));

  if (anchorEl) {
    const diff = anchorEl.getBoundingClientRect().top - anchorTopBefore;
    window.scrollBy({ top: diff, behavior: 'instant' });
  }

  document.getElementById('toggleAllBtn').textContent = allOpen ? 'Tümünü Aç' : 'Tümünü Kapat';
}

function updateToggleAllBtn() {
  const allTerms = document.querySelectorAll('.entry-term');
  if (!allTerms.length) return;
  const allOpen = [...allTerms].every(t => t.classList.contains('open'));
  document.getElementById('toggleAllBtn').textContent = allOpen ? 'Tümünü Kapat' : 'Tümünü Aç';
}


function toggleTheme() {
  const isLight = document.documentElement.classList.toggle('light');
  const sysLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  if (isLight === sysLight) {
    localStorage.removeItem('felsefe-theme'); // sistem temasına dön
  } else {
    localStorage.setItem('felsefe-theme', isLight ? 'light' : 'dark');
  }
}

// Sistem teması değişirse, kullanıcı kaydetmemişse takip et
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => {
  const saved = localStorage.getItem('felsefe-theme');
  if (!saved) {
    if (e.matches) document.documentElement.classList.add('light');
    else document.documentElement.classList.remove('light');
  }
});

// Scroll to top + toggleAll + random görünürlük
const scrollBtn = document.getElementById('scrollTop');
const toggleAllBtn = document.getElementById('toggleAllBtn');
const randomBtn = document.getElementById('randomBtn');
window.addEventListener('scroll', () => {
  const visible = window.scrollY > 124;
  scrollBtn.classList.toggle('visible', visible);
  toggleAllBtn.classList.toggle('visible', visible);
  randomBtn.classList.toggle('visible', visible);
});
scrollBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

let lastRandomTerm = null;

randomBtn.addEventListener('click', () => {
  // Önceki açılanı kapat
  if (lastRandomTerm && lastRandomTerm.classList.contains('open')) {
    closeEntry(lastRandomTerm, false);
  }

  const rand = entries[Math.floor(Math.random() * entries.length)];

  // Terimin DOM elementini bul
  let termEl = null;
  const allTerms = document.querySelectorAll('.entry-term');
  for (let t of allTerms) {
    if (t.querySelector('span').textContent === rand.term) { termEl = t; break; }
  }
  if (!termEl) return;

  lastRandomTerm = termEl;

  // Önce instant scroll, sonra aç
  termEl.scrollIntoView({ behavior: 'instant', block: 'center' });
  openEntry(termEl, false);

  // Parlama efekti
  termEl.style.transition = 'background 0.15s';
  termEl.style.background = 'var(--gold)';
  setTimeout(() => { termEl.style.background = ''; termEl.style.transition = ''; }, 500);
});

renderAll(entries);

// === PWA — Manifest + Service Worker (flPanel yöntemi) ===
(function() {

  function makeIcon(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const isLight = document.documentElement.classList.contains('light');
    const bg     = isLight ? '#f5f0e8' : '#1a1510';
    const accent = isLight ? '#8b4513' : '#c9a84c';
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, size, size);
    const fs = Math.round(size * 0.58);
    ctx.font = `bold ${fs}px serif`;
    ctx.fillStyle = accent;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('φ', size / 2, size * 0.52);
    return c.toDataURL('image/png');
  }

  const icon192 = makeIcon(192);
  const icon512 = makeIcon(512);

  const manifest = {
    name: 'Felsefe Sözlüğü',
    short_name: 'Felsefe Sözlüğü',
    description: 'Ankara Fen Lisesi Felsefe Sözlüğü',
    start_url: './',
    scope: './',
    display: 'standalone',
    orientation: 'any',
    background_color: '#1a1510',
    theme_color: '#1a1510',
    lang: 'tr',
    icons: [
      { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
      { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
    ]
  };

  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const manifestUrl  = URL.createObjectURL(manifestBlob);
  document.getElementById('pwa-manifest').setAttribute('href', manifestUrl);

  const CACHE = 'felsefe-sozlugu-20260508';
  const swCode = `
const CACHE_NAME = 'felsefe-sozlugu-20260508';
const URLS = [self.location.href.replace('/sw-inline', '')];

self.addEventListener('install', e => {
  e.waitUntil(
    caches.open(CACHE_NAME).then(c => c.addAll(URLS)).then(() => self.skipWaiting())
  );
});

self.addEventListener('activate', e => {
  e.waitUntil(
    caches.keys().then(keys =>
      Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k)))
    ).then(() => self.clients.claim())
  );
});

self.addEventListener('fetch', e => {
  if (e.request.method !== 'GET') return;
  e.respondWith(
    fetch(e.request).then(res => {
      const clone = res.clone();
      caches.open(CACHE_NAME).then(c => c.put(e.request, clone));
      return res;
    }).catch(() => caches.match(e.request))
  );
});

self.addEventListener('message', e => {
  if (e.data === 'skipWaiting') self.skipWaiting();
});
`;

  if ('serviceWorker' in navigator) {
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl  = URL.createObjectURL(swBlob);

    navigator.serviceWorker.register(swUrl, { scope: './' })
      .then(reg => {
        reg.addEventListener('updatefound', () => {
          const newSW = reg.installing;
          newSW.addEventListener('statechange', () => {
            if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
              newSW.postMessage('skipWaiting');
              navigator.serviceWorker.addEventListener('controllerchange', () => {
                window.location.reload();
              });
            }
          });
        });
      })
      .catch(() => {});
  }

})();

</script>
