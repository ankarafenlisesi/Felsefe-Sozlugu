<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Felsefe Sözlüğü</title>
<meta name="description" content="Ankara Fen Lisesi Felsefe Sözlüğü">
<meta name="theme-color" content="#1a1510" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Felsefe Sözlüğü">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='80' fill='%231a1510'/><text x='256' y='360' font-size='320' text-anchor='middle' fill='%23c9a84c' font-family='serif'>φ</text></svg>">
<link rel="manifest" id="pwa-manifest">
<script>
  // Erken tema init — flash önlemek için head'de çalışır
  (function() {
    const saved = localStorage.getItem('felsefe-theme');
    if (saved === 'light') {
      document.documentElement.classList.add('light');
    } else {
      try { localStorage.removeItem('felsefe-theme'); } catch(e) {}
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.documentElement.classList.add('light');
      }
    }
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  /* === TEMA: varsayılan koyu === */
  :root {
    --ink: #e8dfc8;
    --paper: #1a1510;
    --aged: #2e2820;
    --accent: #d4894a;
    --gold: #c9a84c;
    --muted: #a89880;
    --light-muted: #6a5a48;
    --highlight: #231e18;
    --entry-def-color: #c8bfaa;
    --search-bg: rgba(0,0,0,0.2);
  }

  /* === Açık tema === */
  :root.light {
    --ink: #1a1208;
    --paper: #f5f0e8;
    --aged: #e8dfc8;
    --accent: #8b4513;
    --gold: #c9a84c;
    --muted: #7a6a55;
    --light-muted: #b5a898;
    --highlight: #f0e6d0;
    --entry-def-color: #3d3020;
    --search-bg: rgba(255,255,255,0.5);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Lora', Georgia, serif;
    min-height: 100vh;
    padding-bottom: 27px;
    background-image:
      radial-gradient(ellipse at 10% 20%, rgba(201,168,76,0.07) 0%, transparent 60%),
      radial-gradient(ellipse at 90% 80%, rgba(139,69,19,0.06) 0%, transparent 60%);
  }

  /* Grain texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 2rem 6rem;
  }

  @media (min-width: 1200px) {
    .wrapper {
      max-width: 1200px;
      padding: 0 4rem 4rem;
    }
  }

  @media (min-width: 1600px) {
    .wrapper {
      max-width: 1400px;
      padding: 0 5rem 4rem;
    }
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 3rem 0 2rem;
    border-bottom: 1px solid var(--gold);
    margin-bottom: 3rem;
    gap: 1rem;
  }

  header::after { display: none; }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 700;
    line-height: 1.1;
    color: var(--ink);
    letter-spacing: -0.02em;
  }

  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .school-label {
    font-family: 'Lora', serif;
    font-size: 0.72rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }
  #theme-btn {
    position: relative;
    width: 36px;
    height: 36px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--highlight);
    border: 1px solid var(--aged);
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
    color: var(--gold);
  }

  #theme-btn:hover { border-color: var(--gold); }

  #theme-btn svg {
    position: absolute;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
  }

  /* Koyu temada: güneş görünür, ay gizli */
  #theme-btn .icon-sun {
    transform: rotate(0deg) scale(1);
    opacity: 1;
  }
  #theme-btn .icon-moon {
    transform: rotate(90deg) scale(0.5);
    opacity: 0;
  }

  /* Açık temada: ay görünür, güneş gizli */
  :root.light #theme-btn .icon-sun {
    transform: rotate(-90deg) scale(0.5);
    opacity: 0;
  }
  :root.light #theme-btn .icon-moon {
    transform: rotate(0deg) scale(1);
    opacity: 1;
  }

  /* Search */
  .search-area {
    margin-bottom: 2.5rem;
    display: flex;
    gap: 0;
    border: 1.5px solid var(--gold);
    background: var(--search-bg);
    border-radius: 2px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }

  .search-area:focus-within {
    box-shadow: 0 2px 20px rgba(201,168,76,0.2);
  }

  .search-icon {
    padding: 0 1rem;
    display: flex;
    align-items: center;
    color: var(--gold);
    font-size: 1rem;
  }

  #searchInput {
    flex: 1;
    padding: 0.85rem 0;
    font-family: 'Lora', serif;
    font-size: 1rem;
    border: none;
    background: transparent;
    color: var(--ink);
    outline: none;
  }

  #searchInput::placeholder { color: var(--light-muted); font-style: italic; }

  .result-count {
    padding: 0 1rem;
    display: flex;
    align-items: center;
    font-size: 0.78rem;
    color: var(--light-muted);
    white-space: nowrap;
    font-style: italic;
  }

  /* Alphabet nav */
  .alpha-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 2.5rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--aged);
    transition: opacity 0.2s;
  }

  .alpha-nav.hidden {
    display: none;
  }

  .alpha-btn {
    padding: 0.3rem 0.6rem;
    font-family: 'Playfair Display', serif;
    font-size: 1.11rem;
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    cursor: pointer;
    border-radius: 2px;
  }
  /* Mobil */
  @media (max-width: 768px) {
    .alpha-btn {
      font-size: 0.87rem;
      padding: 0.17rem 0.19rem;
    }
  }

  .alpha-btn.disabled { opacity: 0.3; cursor: default; pointer-events: none; }

  /* Section headers */
  .section-header {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    margin: 3rem 0 1.5rem;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
  }

  .section-letter {
    font-family: 'Playfair Display', serif;
    font-size: 4rem;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
    min-width: 3.5rem;
    text-align: center;
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, var(--aged), transparent);
  }

  /* Entries — accordion */
  .entry {
    border-bottom: 1px solid rgba(232, 223, 200, 0.6);
    opacity: 0;
    animation: fadeUp 0.4s ease forwards;
  }

  .entry-term {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem 0.5rem;
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--accent);
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.15s, box-shadow 0.15s;
    user-select: none;
  }

  .entry-term:hover {
    background: var(--highlight);
    box-shadow: inset 3px 0 0 var(--gold);
  }

  .entry-term.open {
    background: var(--highlight);
    box-shadow: inset 3px 0 0 var(--accent);
    border-radius: 2px 2px 0 0;
  }

  .entry-chevron {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    color: var(--gold);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .entry-term.open .entry-chevron {
    transform: rotate(180deg);
  }

  /* Scroll anchor koruması */
  .wrapper {
    overflow-anchor: auto;
  }

  .entry-def-wrap {
    height: 0;
    overflow: hidden;
    overflow-anchor: none;
    transition: height 0.32s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .entry-def-inner {
    /* padding için inner kullanılıyor */
  }

  .entry-def {
    font-size: 0.92rem;
    line-height: 1.75;
    color: var(--entry-def-color);
    padding: 0.6rem 0.5rem 1rem 0.5rem;
    background: var(--highlight);
    border-radius: 0 0 2px 2px;
    box-shadow: inset 3px 0 0 var(--accent);
  }

  .entry.hidden { display: none; }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* No results */
  .no-results {
    text-align: center;
    padding: 5rem 0;
    display: none;
  }

  .no-results-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.3; }
  .no-results p { color: var(--muted); font-style: italic; }

  /* Stats */
  .stats-bar {
    display: flex;
    align-items: center;
    gap: 2rem;
    margin-bottom: 2.5rem;
    padding: 0.75rem 1.5rem;
    background: var(--highlight);
    border-left: 3px solid var(--gold);
    font-size: 0.82rem;
    color: var(--muted);
  }

  .stats-bar.hidden { display: none; }

  /* Sabit köşe butonları */
  #scrollTop {
    position: fixed;
    bottom: 5.5rem;
    left: 2rem;
    width: 42px; height: 42px;
    background: var(--accent);
    color: var(--paper);
    border: none;
    border-radius: 2px;
    font-size: 1.2rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(139,69,19,0.3);
  }
  #scrollTop.visible { opacity: 1; }

  #randomBtn {
    position: fixed;
    bottom: 2rem;
    left: 2rem;
    width: 42px; height: 42px;
    background: var(--accent);
    color: var(--paper);
    border: none;
    border-radius: 2px;
    font-size: 1.4rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.3s, background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(139,69,19,0.3);
  }
  #randomBtn.visible { opacity: 1; }
  #randomBtn:hover { background: var(--gold); }

  #toggleAllBtn {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    padding: 0 1rem;
    height: 42px;
    font-family: 'Lora', serif;
    font-size: 0.82rem;
    font-style: italic;
    background: var(--accent);
    border: none;
    color: var(--paper);
    border-radius: 2px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.3s, background 0.15s;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(139,69,19,0.3);
    white-space: nowrap;
  }
  #toggleAllBtn.visible { opacity: 1; }
  #toggleAllBtn:hover { background: var(--gold); }
  footer {
    text-align: center;
    padding: 2.5rem 0 1rem;
    border-top: 1px solid var(--aged);
    margin-top: 4rem;
    font-size: 0.8rem;
    color: var(--light-muted);
    font-style: italic;
  }

  .footer-bottom {
    font-size: 0.75rem;
    color: var(--light-muted);
  }

  @media (max-width: 600px) {
    .entry { gap: 0.4rem; }
    .stats-bar { flex-direction: column; gap: 0.5rem; }
  }
</style>
</head>
<body>

<div class="wrapper">

  <header>
    <div>
      <p class="school-label">Ankara Fen Lisesi</p>
      <h1>Felsefe <em>Sözlüğü</em></h1>
    </div>
    <button id="theme-btn" onclick="toggleTheme()" title="Tema değiştir">
      <!-- Güneş -->
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <!-- Ay -->
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <div class="search-area">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Kavram ara…" autocomplete="off">
    <span class="result-count" id="resultCount"></span>
  </div>

  <div class="alpha-nav" id="alphaNav"></div>



  <div id="dictionary"></div>
  <div class="no-results" id="noResults">
    <div class="no-results-icon">∅</div>
    <p>Aradığınız kavram bulunamadı.</p>
  </div>

  <footer>
  <div class="footer-bottom">
    Ankara Fen Lisesi · Felsefe Sözlüğü
  </div>
</footer>
</div>

<button id="scrollTop" title="Yukarı çık">↑</button>
<button id="randomBtn" title="Rastgele kavram">⚄</button>
<button id="toggleAllBtn" onclick="toggleAll()">Tümünü Aç</button>

<script>
const entries = [
  { term: "Açıklama", def: "Bir şeyi bilinir ve anlaşılır hâle getirme. Bir sorunun, bilinmeyen bir şeyin, bir olgunun nedenini açık ve anlaşılır biçimde ortaya koyma." },
  { term: "Adalet", def: "Hakların gözetildiği, bireylerin eşit ve dengeli şekilde değerlendirildiği toplumsal düzen anlayışı. Hak sahibine hakkı olanı zamanında vermeye dayalı anlayış." },
  { term: "Ahlâk", def: "Genel anlamda mutlak olarak iyi olduğu düşünülen ya da belli bir yaşam anlayışından kaynaklanan davranış kuralları bütünü." },
  { term: "Akıl", def: "İnsanda soyutlama yapabilme, kavrayabilme, bağlantı kurabilme, düşünme, benzerlik ve farklılıkları anlayabilme ve anlamlandırabilme kapasitesi." },

  { term: "Analiz", def: "Bir bütünün parçalanarak ayrı ayrı incelenmesi, parçaların birbiriyle olan ilişkilerinin incelenmesi veya bu parçaların bütünle olan ilişkilerinin incelenme süreci." },
  { term: "Analoji", def: "Aklın, bazı olguların birbirine benzeyen özelliklerinden yola çıkarak onların başka alanlarda da birbirine benzediğini öne süren çıkarsamaya verilen ad." },
  { term: "Anarşizm", def: "Nispeten olumlu bir çerçeve içerisinde insanın özü itibariyle iyi olduğunu ve insan yaşamında karşılaşılan kötülüklerin politik baskı ve insanlar üzerindeki kontrolden geldiğini savunan politik anlayış." },
  { term: "Aposteriori Bilgi", def: "Duyusal deneyden türetilen ve duyu deneyi aracılığıyla kazanılan bilgi." },
  { term: "Apriori Bilgi", def: "Aklın ve aklın etkinliğinden üretilen ve duyusal deneye başvurulmadan elde edilen bilgi." },
  { term: "Arkhe", def: "Antik Yunan felsefesinde her şeyin kendinden varlığa geldiği düşünülen töz. \"ilk olan\", \"ilk neden\", \"kaynak\" gibi anlamlara da gelebilir." },
  { term: "Aşkın", def: "Genel olarak en üstün, en yüce, en yüksek niteliklere sahip olan varlık, transandantal." },
  { term: "Bağımsız", def: "Mantıksal olarak başka bir önermeden çıkmayan, bir mantıksal sistemin çıkarım kurallarıyla türetilemeyen." },
  { term: "Bağlam", def: "Bir şeyle doğrudan ilişkide bulunan, o şeyin bir anlamda kaynağını oluşturan, söz konusu şey karşısında tavırlarımızı ve ona ilişkin bilgilerimizi etkileyen anlamlar, düşünceler, ön kabuller ve perspektifler toplamı." },
  { term: "Belirsizlik", def: "Sözcüklerin, kavramların, adlandırdıkları veya uyguladıkları nesnelerin kapsamının net olarak bilinememesi durumu." },

  { term: "Bilinç", def: "Etrafındaki dünyanın, çevredeki varlıkların ve kendinin farkında olmak, duyabilmek, hissedebilmek, duyumlara uygun tepkiler verebilmek." },
  { term: "Bilinçaltı", def: "Gerçekte bilinç süreçleri olmadıkları halde bilinç süreçleri üstünde etkisi bulunan ruhsal süreçler." },
  { term: "Bürokrasi", def: "Bir toplumda tabandan yukarıya doğru daralan yapı içinde örgütlenmiş olan, kişisel olmayan genel kurallar ve işleyiş ilkelerine çalışan profesyonel görevliler grubu." },
  { term: "Cebriye", def: "İslâm dünyasında iyi ve kötünün bizzat Tanrı'dan geldiğini düşünen ve her eylemin önceden belirlenmiş yaratılıp takdir edildiğini söyleyen öğreti." },
  { term: "Cesaret", def: "Kişiye bir tehlikeyi, söz konusu olabilecek korku tarafından alt edilmeksizin göğüsleme imkânı veren zihniyet." },

  { term: "Çelişki", def: "Mantıkta bir önermenin hem kabulüne hem inkârından oluşan kümeye verilen ad." },
  { term: "Çıkarım", def: "Bir veya birden çok önermeden mantıksal sonuç elde etme. Doğruluğu bilinen bir önermeden yeni bir önerme çıkarma işi." },
  { term: "Çürütme", def: "Bir önerme veya kanıtlamayı, yanlışını göstermek suretiyle yanlışlama." },
  { term: "Davranışçılık", def: "İnsan ve hayvan davranışları inceleyen psikoloji alanına verilen ad." },
  { term: "Dayanak", def: "Genel olarak niteliklerin kendisine bağlandığı temel." },
  { term: "Değer", def: "Bireyin çevresiyle etkileşimi sonucunda içselleştirdiği, eylemlerini yönlendirdiği kalıcı bir yargı ve standart." },

// Sort entries alphabetically (Turkish locale)
entries.sort((a, b) => a.term.localeCompare(b.term, 'tr'));

// Group by first letter
function getFirstLetter(term) {
  const t = term.trim();
  const first = t[0].toLocaleUpperCase('tr');
  return first;
}

function groupEntries(list) {
  const groups = {};
  list.forEach(e => {
    const l = getFirstLetter(e.term);
    if (!groups[l]) groups[l] = [];
    groups[l].push(e);
  });
  return groups;
}

// Render
const dictEl = document.getElementById('dictionary');
const searchInput = document.getElementById('searchInput');
const resultCountEl = document.getElementById('resultCount');
const noResults = document.getElementById('noResults');
const alphaNav = document.getElementById('alphaNav');
searchInput.placeholder = entries.length + ' kavram içinde ara…';

function renderAll(list) {
  dictEl.innerHTML = '';
  const groups = groupEntries(list);
  const letters = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'tr'));

if (list.length === 0) {
    noResults.style.display = 'block';
    resultCountEl.textContent = '0 sonuç';
    return;
  }

  noResults.style.display = 'none';

  letters.forEach((letter, gi) => {
    const section = document.createElement('div');
    section.className = 'section';
    section.id = 'section-' + letter;

    const header = document.createElement('div');
    header.className = 'section-header';
    header.style.animationDelay = (gi * 0.05) + 's';
    header.innerHTML = `<div class="section-letter">${letter}</div><div class="section-line"></div>`;
    section.appendChild(header);

    groups[letter].forEach((e, i) => {
      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.style.animationDelay = (gi * 0.05 + i * 0.03) + 's';
      entry.innerHTML = `
        <div class="entry-term" onclick="toggleEntry(this)">
          <span>${e.term}</span>
          <svg class="entry-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
        <div class="entry-def-wrap">
          <div class="entry-def-inner">
            <div class="entry-def">${e.def}</div>
          </div>
        </div>`;
      section.appendChild(entry);
    });

    dictEl.appendChild(section);
  });
}

// Alpha nav
const allLetters = [...new Set(entries.map(e => getFirstLetter(e.term)))].sort((a,b) => a.localeCompare(b,'tr'));
const turkishAlpha = ['A','B','C','Ç','D','E','F','G','H','I','İ','J','K','L','M','N','O','Ö','P','R','S','Ş','T','U','Ü','V','Y','Z'];

turkishAlpha.forEach(l => {
  const btn = document.createElement('button');
  btn.className = 'alpha-btn' + (allLetters.includes(l) ? '' : ' disabled');
  btn.textContent = l;
  if (allLetters.includes(l)) {
    btn.addEventListener('click', () => {
      const el = document.getElementById('section-' + l);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }
  alphaNav.appendChild(btn);
});

// Search — sadece terim adında ara
searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLocaleLowerCase('tr').trim();
  if (!q) {
    alphaNav.classList.remove('hidden');
    renderAll(entries);
    resultCountEl.textContent = '';
    return;
  }
  alphaNav.classList.add('hidden');
  const filtered = entries.filter(e =>
    e.term.toLocaleLowerCase('tr').includes(q)
  );
  renderAll(filtered);
  resultCountEl.textContent = filtered.length + ' sonuç';
});

// === Accordion ===

function openEntry(termEl, instant) {
  const wrap = termEl.nextElementSibling;
  const inner = wrap.firstElementChild;
  termEl.classList.add('open');
  if (instant) {
    wrap.style.transition = 'none';
    wrap.style.height = inner.offsetHeight + 'px';
  } else {
    wrap.style.transition = 'none';
    wrap.style.height = 'auto';
    const h = inner.offsetHeight;
    wrap.style.height = '0';
    requestAnimationFrame(() => {
      wrap.style.transition = '';
      wrap.style.height = h + 'px';
    });
  }
}

function closeEntry(termEl, instant) {
  const wrap = termEl.nextElementSibling;
  termEl.classList.remove('open');
  if (instant) {
    wrap.style.transition = 'none';
    wrap.style.height = '0';
  } else {
    wrap.style.height = wrap.offsetHeight + 'px';
    requestAnimationFrame(() => {
      wrap.style.transition = '';
      wrap.style.height = '0';
    });
  }
}

function toggleEntry(termEl) {
  if (termEl.classList.contains('open')) {
    closeEntry(termEl, false);
  } else {
    openEntry(termEl, false);
  }
  updateToggleAllBtn();
}

function toggleAll() {
  const allTerms = document.querySelectorAll('.entry-term');
  const allOpen = [...allTerms].every(t => t.classList.contains('open'));

  // Anchor: ekranın ortasına en yakın entry
  let anchorEl = null;
  const mid = window.innerHeight / 2;
  let minDist = Infinity;
  allTerms.forEach(t => {
    const dist = Math.abs(t.getBoundingClientRect().top - mid);
    if (dist < minDist) { minDist = dist; anchorEl = t; }
  });

  const anchorTopBefore = anchorEl ? anchorEl.getBoundingClientRect().top : 0;

  allTerms.forEach(t => allOpen ? closeEntry(t, true) : openEntry(t, true));

  if (anchorEl) {
    const diff = anchorEl.getBoundingClientRect().top - anchorTopBefore;
    window.scrollBy({ top: diff, behavior: 'instant' });
  }

  document.getElementById('toggleAllBtn').textContent = allOpen ? 'Tümünü Aç' : 'Tümünü Kapat';
}

function updateToggleAllBtn() {
  const allTerms = document.querySelectorAll('.entry-term');
  if (!allTerms.length) return;
  const allOpen = [...allTerms].every(t => t.classList.contains('open'));
  document.getElementById('toggleAllBtn').textContent = allOpen ? 'Tümünü Kapat' : 'Tümünü Aç';
}


function toggleTheme() {
  const isLight = document.documentElement.classList.toggle('light');
  const sysLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  if (isLight === sysLight) {
    localStorage.removeItem('felsefe-theme'); // sistem temasına dön
  } else {
    localStorage.setItem('felsefe-theme', isLight ? 'light' : 'dark');
  }
}

// Sistem teması değişirse, kullanıcı kaydetmemişse takip et
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => {
  const saved = localStorage.getItem('felsefe-theme');
  if (!saved) {
    if (e.matches) document.documentElement.classList.add('light');
    else document.documentElement.classList.remove('light');
  }
});

// Scroll to top + toggleAll + random görünürlük
const scrollBtn = document.getElementById('scrollTop');
const toggleAllBtn = document.getElementById('toggleAllBtn');
const randomBtn = document.getElementById('randomBtn');
window.addEventListener('scroll', () => {
  const visible = window.scrollY > 200;
  scrollBtn.classList.toggle('visible', visible);
  toggleAllBtn.classList.toggle('visible', visible);
  randomBtn.classList.toggle('visible', visible);
});
scrollBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

let lastRandomTerm = null;

randomBtn.addEventListener('click', () => {
  // Önceki açılanı kapat
  if (lastRandomTerm && lastRandomTerm.classList.contains('open')) {
    closeEntry(lastRandomTerm, false);
  }

  const rand = entries[Math.floor(Math.random() * entries.length)];

  // Terimin DOM elementini bul
  let termEl = null;
  const allTerms = document.querySelectorAll('.entry-term');
  for (let t of allTerms) {
    if (t.querySelector('span').textContent === rand.term) { termEl = t; break; }
  }
  if (!termEl) return;

  lastRandomTerm = termEl;

  // Önce instant scroll, sonra aç
  termEl.scrollIntoView({ behavior: 'instant', block: 'center' });
  openEntry(termEl, false);

  // Parlama efekti
  termEl.style.transition = 'background 0.15s';
  termEl.style.background = 'var(--gold)';
  setTimeout(() => { termEl.style.background = ''; termEl.style.transition = ''; }, 500);
});

renderAll(entries);

(function() {

  function makeIcon(size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');

    const bg     = isLight ? '#f5f0e8' : '#1a1510';
    const accent = isLight ? '#8b4513' : '#c9a84c';
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, size, size);
    const fs = Math.round(size * 0.58);
    ctx.font = `bold ${fs}px serif`;
    ctx.fillStyle = accent;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('φ', size / 2, size * 0.52);
    return c.toDataURL('image/png');
  }

  const icon192 = makeIcon(192);
  const icon512 = makeIcon(512);

  const manifest = {
    name: 'Felsefe Sözlüğü',
    short_name: 'Felsefe Sözlüğü',
    description: 'Ankara Fen Lisesi Felsefe Sözlüğü',
    start_url: './',
    scope: './',
    display: 'standalone',
    orientation: 'any',
    background_color: '#1a1510',
    theme_color: '#1a1510',
    lang: 'tr',
    icons: [
      { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
      { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
    ]
  };

  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const manifestUrl  = URL.createObjectURL(manifestBlob);
  document.getElementById('pwa-manifest').setAttribute('href', manifestUrl);

  const CACHE = 'felsefe-sozlugu-20260508';
  const swCode = `
const CACHE_NAME = 'felsefe-sozlugu-20260508';
const URLS = [self.location.href.replace('/sw-inline', '')];

self.addEventListener('install', e => {
  e.waitUntil(
    caches.open(CACHE_NAME).then(c => c.addAll(URLS)).then(() => self.skipWaiting())
  );
});

self.addEventListener('activate', e => {
  e.waitUntil(
    caches.keys().then(keys =>
      Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k)))
    ).then(() => self.clients.claim())
  );
});

self.addEventListener('fetch', e => {
  if (e.request.method !== 'GET') return;
  e.respondWith(
    fetch(e.request).then(res => {
      const clone = res.clone();
      caches.open(CACHE_NAME).then(c => c.put(e.request, clone));
      return res;
    }).catch(() => caches.match(e.request))
  );
});

self.addEventListener('message', e => {
  if (e.data === 'skipWaiting') self.skipWaiting();
});
`;

  if ('serviceWorker' in navigator) {
    const swBlob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl  = URL.createObjectURL(swBlob);

    navigator.serviceWorker.register(swUrl, { scope: './' })
      .then(reg => {
        reg.addEventListener('updatefound', () => {
          const newSW = reg.installing;
          newSW.addEventListener('statechange', () => {
            if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
              newSW.postMessage('skipWaiting');
              navigator.serviceWorker.addEventListener('controllerchange', () => {
                window.location.reload();
              });
            }
          });
        });
      })
      .catch(() => {});
  }

})();
